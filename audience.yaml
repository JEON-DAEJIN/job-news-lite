# JobNewsLite — 타깃 독자, 중요도 기준, 제외 조건
# 이 파일이 선별 기준의 단일 출처(source of truth)다. graph.py의 필터/프롬프트가
# 전부 이 파일을 읽어서 동작한다 — 조건을 바꾸고 싶으면 코드가 아니라 이 파일을 고친다.

persona:
  name: "DJ 대표"
  background: "콘텐츠산업(방송·게임·웹툰·K-컬처) 및 신규사업 기획/전략기획 분야 28년 경력"
  target_groups:
    public: "정부·공공기관·대학의 콘텐츠/신규사업 관련 조직 — 센터장·본부장·팀장·책임연구원·전문위원급"
    company: "일반기업의 콘텐츠/신사업/전략기획 분야 — C-Level, 임원급(이사/상무/전무), 본부장/총괄"

# 수집 범위: 이 기간(일) 이내 게시된 공고/뉴스만 유효한 후보로 취급한다.
recency_days: 30

# 1~2차 키워드 게이트 (rules.py가 그대로 읽어서 씀)
include_keywords:
  position:
    - 센터장
    - 본부장
    - 팀장
    - 책임연구원
    - 전문위원
    - 이사
    - 상무
    - 전무
    - 총괄
    - 대표
    - C-Level
    - CEO
    - COO
    - CSO
  field:
    - 콘텐츠
    - 웹툰
    - 게임
    - 방송
    - K-컬처
    - 케이컬처
    - 신사업
    - 신규사업
    - 전략기획

exclude_keywords:
  level:
    - 사원
    - 대리
    - 주임
    - 인턴
  field:
    - 단순회계
    - 생산관리

# 3차 관련도 점수 임계치 (0~100). 이 점수 미만은 최종 리포트에서 제외한다.
score_threshold: 60

# 자료 수집 소스 — "최소 3개 이상"을 만족시키기 위해 검색 대상을 서로 겹치지 않는
# 3갈래로 나눈다. 실제 API/RSS 계약 대신 WebSearch 쿼리를 트랙별로 분리한 이유는
# REPORT.md "소스 채택표"에 근거와 함께 기록돼 있다.
sources:
  - id: public_agency
    label: "정부·공공기관·대학 채용 공고"
    query_hint: >
      정부, 공공기관, 대학 산하 기관의 공식 채용 공고 및 인사 발령 뉴스. 워크넷·나라일터·
      기관 홈페이지 채용정보 페이지 위주로 찾는다.
  - id: job_platform
    label: "채용 플랫폼 공고"
    query_hint: >
      사람인·잡코리아·인크루트 등 채용 플랫폼에 등록된 일반기업의 임원급/C-Level 채용 공고.
  - id: exec_news
    label: "임원 인사·영입 뉴스"
    query_hint: >
      언론사의 임원 인사 발령, 신규 임원 영입, 조직 개편 관련 뉴스 기사(공고가 아니라
      뉴스 형태로만 확인되는 인사 정보 포함).
